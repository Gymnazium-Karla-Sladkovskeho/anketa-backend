stages:
  - test

# --- ON MR or MAIN (Hotfixes) ---

workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# auto-cancel redundant pipelines
default:
  interruptible: true

backend-integration-tests:
  stage: test
  image: eclipse-temurin:21
  script:
    - cd backend
    - ./gradlew test
  
blackbox-api:
  stage: test
  image: eclipse-temurin:21-alpine
  services:
    - name: postgres:18
      alias: postgres
  before_script:
    - apk add curl bash
    - apk add --repository http://dl-cdn.alpinelinux.org/alpine/edge/testing hurl
  script:
    - cd backend
    - ls
    - ls ..
    - ls ../..
    - source ../.env
    - source blackbox/test.env
    - ./gradlew run -Penv=test &
    - curl --retry 30 --retry-delay 2 --retry-connrefused -s http://localhost:${BACKEND_PORT}/ > /dev/null
    - ./blackboxes/run.sh
