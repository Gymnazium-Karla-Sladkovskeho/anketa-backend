stages:
  - test

# --- ON MR or MAIN (Hotfixes) ---

workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# auto-cancel redundant pipelines
default:
  interruptible: true

backend-integration-tests:
  stage: test
  image: eclipse-temurin:21
  script:
    - cd backend
    - ./gradlew test

blackbox-api:
  stage: test
  image: eclipse-temurin:21-alpine
  services:
    - name: postgres:18
      alias: postgres
  variables:
    # Throwaway CI database: any password is accepted ("trust").
    # The DB name is NOT set here; it is created below from POSTGRES_DB
    # in backend/blackbox/test.env, so it lives in one place only.
    POSTGRES_USER: user
    POSTGRES_HOST_AUTH_METHOD: trust
  before_script:
    # postgresql-client = psql (used by run.sh) + createdb
    - apk add curl bash socat postgresql-client
    - apk add --repository http://dl-cdn.alpinelinux.org/alpine/edge/testing hurl
  script:
    # Backend and run.sh expect Postgres on localhost:5432; the service is "postgres"
    - socat TCP-LISTEN:5432,fork,reuseaddr TCP:postgres:5432 &

    - cd backend
    - sed -i 's/\r$//' ../.env blackbox/test.env blackbox/run.sh
    - set -a
    - . ../.env
    - . ./blackbox/test.env
    - set +a

    # Create the test database named in test.env (POSTGRES_DB=gykas_test)
    - createdb -h postgres -U "$POSTGRES_USER" "$POSTGRES_DB"

    - ./gradlew run -Penv=test > ../backend.log 2>&1 &
    - BACKEND_PID=$!
    - |
      for i in $(seq 1 90); do
        kill -0 $BACKEND_PID 2>/dev/null || { echo "Backend crashed:"; tail -n 40 ../backend.log; exit 1; }
        curl -fs "http://localhost:${BACKEND_PORT}/" > /dev/null && break
        sleep 2
      done
    - curl -fsS "http://localhost:${BACKEND_PORT}/" > /dev/null
    - bash blackbox/run.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - backend.log