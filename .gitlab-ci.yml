stages:
  - test

# --- ON MR or MAIN (Hotfixes) ---
workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# auto-cancel redundant pipelines
default:
  interruptible: true

backend-integration-tests:
  stage: test
  image: eclipse-temurin:21
  script:
    - cd backend
    - ./gradlew test

blackbox-api:
  stage: test
  image: eclipse-temurin:21-jdk-noble
  services:
    - name: postgres:18
      alias: postgres
  variables:
    # Throwaway CI database: any password is accepted ("trust").
    # The DB name comes from POSTGRES_DB in backend/blackbox/test.env.
    POSTGRES_USER: user
    POSTGRES_HOST_AUTH_METHOD: trust
    HURL_VERSION: "8.1.0"
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq > /dev/null
    - apt-get install -y -qq curl ca-certificates postgresql-client software-properties-common > /dev/null
    - apt-add-repository -y ppa:lepapareil/hurl > /dev/null 2>&1
    - apt-get install -y -qq hurl="${HURL_VERSION}"* > /dev/null
  script:
    # Backend and run.sh expect Postgres on localhost:5432; the service is "postgres"
    - cd backend
    - . ../.env
    - . ./blackbox/test.env

    # Create the test database named in test.env
    - export POSTGRES_HOST=postgres
    - createdb -h postgres -U "$POSTGRES_USER" "$POSTGRES_DB"
    - ./gradlew run -Penv=test > ../backend.log 2>&1 &
    - cat ../backend.log
    - curl --retry 30 --retry-delay 2 --retry-connrefused -s "http://localhost:${BACKEND_PORT:-8081}/" > /dev/null
    - ./blackbox/run.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - backend.log