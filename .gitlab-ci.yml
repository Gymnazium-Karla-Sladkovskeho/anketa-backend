stages:
  - test

# --- ON MR or MAIN (Hotfixes) ---
workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# auto-cancel redundant pipelines
default:
  interruptible: true

backend-integration-tests:
  stage: test
  image: eclipse-temurin:21
  script:
    - cd backend
    - ./gradlew test

blackbox-api:
  stage: test
  image: eclipse-temurin:21-jdk-noble
  services:
    - name: postgres:18
      alias: postgres
  variables:
    # Throwaway CI database: any password is accepted ("trust").
    # Passed to both the job and the postgres service: the service creates
    # POSTGRES_DB on startup, and real env vars win over .env / test.env
    # (in the backend and in run.sh), so everything connects to "postgres".
    # POSTGRES_DB must match test.env (run.sh refuses any other database).
    POSTGRES_USER: user
    POSTGRES_HOST_AUTH_METHOD: trust
    POSTGRES_HOST: postgres
    POSTGRES_DB: gykas_test
    HURL_VERSION: "8.1.0"
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq > /dev/null
    - apt-get install -y -qq curl ca-certificates postgresql-client software-properties-common > /dev/null
    - apt-add-repository -y ppa:lepapareil/hurl > /dev/null 2>&1
    - apt-get install -y -qq hurl="${HURL_VERSION}"* > /dev/null
  script:
    # Do not source ../.env here: exported .env values would override the
    # CI variables above (POSTGRES_HOST=localhost).
    - cd backend
    - ./gradlew run -Penv=test > ../backend.log 2>&1 &
    # Wait for the backend (cold Gradle build), up to 60 x 4 s.
    - curl -fsS --retry 60 --retry-delay 4 --retry-all-errors "http://localhost:8081/" > /dev/null
    - ./blackbox/run.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - backend.log