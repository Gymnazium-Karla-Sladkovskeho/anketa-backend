ktor:
  deployment:
    port: "$BACKEND_PORT"
  application:
    modules:
      - cz.cvut.fit.gykas.ApplicationKt.module

# Values match docker-compose.yml + .env one folder above this project.
# Each value can be overridden by an environment variable.
postgres:
  url: "jdbc:postgresql://$POSTGRES_HOST:${POSTGRES_PORT}/${POSTGRES_DB}"
  user: "$POSTGRES_USER"
  password: "$POSTGRES_PASSWORD"

# JWT authentication (see core/plugins/Security.kt).
# The defaults are for local development only — set JWT_SECRET in real deployments.
jwt:
  secret: "$JWT_SECRET:secret"
  issuer: "$JWT_ISSUER:http://localhost:8080/"
  audience: "$JWT_AUDIENCE:gykas"
  realm: "$JWT_REALM:gykas"
